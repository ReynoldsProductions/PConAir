<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PConAir — Prompter</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fbf8f6;
      --border: #dfe0e1;
      --text: #333333;
      --text-dim: #757575;
      --accent: #1a6dd4;
      --on-accent: #ffffff;
      --warn: #9a6100;
      --err: #b3261e;
    }
    [data-theme="dark"] {
      --bg: #111315;
      --surface: #1c1f22;
      --border: #33383d;
      --text: #e8eaec;
      --text-dim: #9aa0a6;
      --accent: #4da3ff;
      --on-accent: #08111c;
      --warn: #e5a53a;
      --err: #e53935;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 640px;
      margin: 0 auto;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    header h1 { font-size: 18px; margin: 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .hint-line { font-size: 12px; color: var(--text-dim); margin: 0 0 10px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .small-btn { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
    .small-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  </style>
</head>
<body>
  <header>
    <h1>Prompter</h1>
  </header>
  <div class="card">
    <h3 style="margin:0 0 10px;font-size:14px;">Google Account</h3>
    <p class="hint-line">Script Source below reads Google Docs through this sign-in — the same one Slides mode uses. A link-shared doc works without signing in.</p>
    <p id="pcp-google-status" class="hint-line">Checking…</p>
    <div class="btn-row">
      <button id="pcp-google-signin" class="small-btn primary">Sign in to Google</button>
      <button id="pcp-google-refresh" class="small-btn">Refresh</button>
    </div>
  </div>
  <div class="card" id="pcp-mount"></div>
</body>
</html>
