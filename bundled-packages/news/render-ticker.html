<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faire Wire — ticker</title>
<!--
  Ticker render: Faire logo bug + crawling headlines. Transparent 1920x1080,
  keyed over camera/program (or over a recorded spot).

  State-driven — see /packages/news/control. The lower thirds are a SEPARATE
  render (render-l3.html) so they can be stacked over this one and taken/cleared
  independently. Keep the two in sync on the bar height: the L3 render sits at
  bottom:124px, which clears this 96px bar.

  Headline syntax is `lead:: rest of headline` — the part before :: renders in
  the tan accent colour.
-->
<style>
  /* self-hosted, so a lost connection cannot silently change the typeface
     mid-broadcast (these ship with the app at graphics/_fonts/) */
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:block;src:url('/graphics/_fonts/inter-latin-400.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:block;src:url('/graphics/_fonts/inter-latin-600.woff2') format('woff2');}
</style>
<style>
  :root{
    --ink:#333333; --cream:#fbf8f6; --tan:#b5a998;
    --font-sans:'Inter',-apple-system,sans-serif;
    --ticker-h:96px;
    --crawl:180s;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;
    font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  #stage{position:absolute;inset:0;}

  .ticker{position:absolute;left:0;right:0;bottom:0;height:var(--ticker-h);display:flex;align-items:stretch;
    background:rgba(51,51,51,.94);border-top:2px solid var(--tan);
    transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.7,.2,1);}
  .ticker.in{transform:none;}
  /* logo bug — replaces the old "Faire Wire" wordmark. The inlined mark paints
     in currentColor, so `logo` just swaps the chip fill + text colour. */
  .ticker .bug{display:flex;align-items:center;justify-content:center;padding:0 34px;
    background:var(--tan);color:var(--ink);flex:none;}
  .ticker .bug.on-dark{background:rgba(51,51,51,0);color:var(--cream);}
  .ticker .bug.cream{background:var(--cream);color:var(--ink);}
  .ticker .bug .wordmark{display:block;height:26px;width:auto;}
  .ticker .mask{flex:1;overflow:hidden;position:relative;}
  .ticker .track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;
    white-space:nowrap;will-change:transform;animation:crawl var(--crawl) linear infinite;}
  .ticker .item{font-size:23px;color:var(--cream);padding:0 4px;letter-spacing:.01em;}
  .ticker .item b{color:var(--tan);font-weight:600;}
  .ticker .sep{color:#8a8378;padding:0 26px;font-size:18px;}
  @keyframes crawl{from{transform:translateX(0);} to{transform:translateX(-50%);}}
</style>
</head>
<body>
<div id="stage">
  <div class="ticker" id="ticker">
    <div class="bug" id="bug">

<script src="/packages/news/assets/state.js"></script>
<script>
  const g = (id) => document.getElementById(id);
  const LOGO_CLASS = { cream: 'cream', plain: 'on-dark' };

  // `lead:: rest` → <b>lead</b> rest
  function renderItem(text) {
    const raw = String(text);
    const item = document.createElement('span');
    item.className = 'item';
    const at = raw.indexOf('::');
    if (at >= 0) {
      const strong = document.createElement('b');
      strong.textContent = raw.slice(0, at).trim();
      item.appendChild(strong);
      item.appendChild(document.createTextNode(raw.slice(at + 2)));
    } else {
      item.textContent = raw;
    }
    return item;
  }

  function buildRun(items) {
    const frag = document.createDocumentFragment();
    items.forEach((text) => {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '◆';
      frag.appendChild(renderItem(text));
      frag.appendChild(sep);
    });
    return frag;
  }

  // Rebuilding restarts the crawl, so only do it when the copy actually changed.
  let tickerKey = '';
  function rebuild(items) {
    const track = g('track');
    track.textContent = '';
    track.appendChild(buildRun(items));
    track.appendChild(buildRun(items)); // two runs → the -50% keyframe loops seamlessly
  }

  function applyState(s) {
    const items = Array.isArray(s.tickerItems) ? s.tickerItems.filter(Boolean) : [];

    const bug = g('bug');
    bug.classList.remove('cream', 'on-dark');
    const cls = LOGO_CLASS[s.logo];
    if (cls) bug.classList.add(cls);

    const secs = Number(s.tickerSeconds);
    if (isFinite(secs) && secs > 0) {
      document.documentElement.style.setProperty('--crawl', secs + 's');
    }

    const key = JSON.stringify(items);
    if (key !== tickerKey) {
      tickerKey = key;
      rebuild(items);
    }

    g('ticker').classList.toggle('in', s.tickerVisible !== false && items.length > 0);
  }

  PConAirPackage.connect('news', applyState);
</script>
