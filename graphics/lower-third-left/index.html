<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lower Third — Left</title>
<!--
  Left-hand lower third as its own scene, so it can be stacked over the ticker
  (graphics/news) and animated on/off independently.

  Titling two speakers at once? If your playout gives you one URL per output, use
  graphics/lower-third-duo instead — it holds both cards in a single page. Use
  this page plus lower-third-right only when you can layer two separate sources.

  Transparent background — keyed over camera/program downstream. (This is NOT
  graphics/lower-third-live, which is the opaque, WebSocket-driven card for
  external hardware keyers; that one stays as it is.)

  Style, timings and URL params: ../_shared/lower-third.css + lower-third.js
  Pass a param empty (?title=) to drop that line entirely.
-->
<link rel="stylesheet" href="../_shared/lower-third.css">
</head>
<body data-theme="default">
<div id="stage">
  <div class="l3" data-side="left">
    <div class="accent"></div>
    <div class="text">
      <div class="name">Jane Smith</div>
      <div class="title">Chief Executive Officer</div>
      <div class="subtitle"></div>
    </div>
  </div>
</div>
<script src="../_shared/lower-third.js"></script>
</body>
</html>
