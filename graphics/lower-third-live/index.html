<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lower Third — Live</title>
<!--
  Live, WebSocket-driven lower thirds for external hardware/software keying.

  - State comes exclusively from the `?graphics=1` WS channel (see the script
    at the bottom): it reads `msg.payload.graphics.lowerThirds.left` and
    `.right`, the `LowerThirdState | null` shapes produced by the
    `lower_third_apply` / `lower_third_hide` actions (side param) in
    src/main/action-dispatch.ts. Left and right are fully independent — either,
    both, or neither can be on air at once.
  - Unlike graphics/news/index.html and graphics/scoreboard-basketball, this
    template renders on a fully opaque solid black background: it is meant
    for external keyers (not in-browser camera compositing), so it must never
    be transparent.
-->
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:block;src:url('../_fonts/inter-latin-400.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:block;src:url('../_fonts/inter-latin-600.woff2') format('woff2');}
</style>
<style>
  :root{
    --font-sans:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--backdrop,#000);
    font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  /* Backdrop comes from Admin -> Background (AppState.background); the #000
     default is what shows until the first state message lands. */
  #stage{position:absolute;inset:0;background:var(--backdrop,#000);perspective:1200px;}

  /* ── lower third — geometry lifted from graphics/news/index.html's .l3 rules, ──
     ── generalized to read colors from per-theme CSS custom properties ── */
  /* panel 861x169 max, accent 5x104 @x24, name 52 / title 32, margin 96 */
  /* --l3-ms: entrance duration, set inline from LowerThirdState.fadeMs (exit runs at ~0.55x that). */
  .l3{position:absolute;bottom:96px;
    width:max-content;min-width:400px;max-width:861px;min-height:169px;background:var(--panel-fill);
    border:1px solid var(--panel-border);border-radius:4px;display:flex;align-items:center;
    box-shadow:0 4px 24px rgba(0,0,0,.4);
    --l3-ms:550ms;
    transform:translateX(var(--off));opacity:0;
    transition:transform calc(var(--l3-ms) * 1ms) cubic-bezier(.2,.7,.2,1),
               opacity calc(var(--l3-ms) * .91ms) ease-out;}
  .l3.in{transform:none;opacity:1;}
  /* exit: shorter, ease-in reverse of the enter transition */
  .l3.out{transition:transform calc(var(--l3-ms) * .36ms) cubic-bezier(.4,0,1,1),
                     opacity calc(var(--l3-ms) * .33ms) ease-in;
    transform:translateX(var(--off));opacity:0;}

  .l3[data-side="left"]{left:96px;--off:-960px;}
  .l3[data-side="right"]{right:96px;--off:960px;flex-direction:row-reverse;}
  .l3[data-side="right"] .text{text-align:right;}

  /* style-wipe: clip-reveal, from the panel's own leading edge per side */
  .l3.style-wipe{transform:none;clip-path:inset(0 100% 0 0);
    transition:clip-path calc(var(--l3-ms) * 1ms) cubic-bezier(.2,.7,.2,1),
               opacity calc(var(--l3-ms) * .91ms) ease-out;}
  .l3.style-wipe.in{clip-path:inset(0 0 0 0);opacity:1;}
  .l3.style-wipe.out{transition:clip-path calc(var(--l3-ms) * .36ms) cubic-bezier(.4,0,1,1),
                     opacity calc(var(--l3-ms) * .33ms) ease-in;
    clip-path:inset(0 100% 0 0);opacity:0;}
  .l3[data-side="right"].style-wipe{clip-path:inset(0 0 0 100%);}
  .l3[data-side="right"].style-wipe.in{clip-path:inset(0 0 0 0);}
  .l3[data-side="right"].style-wipe.out{clip-path:inset(0 0 0 100%);}

  /* style-grow: scale up from the panel's own leading edge */
  .l3.style-grow{transform:scaleX(.05);transform-origin:left center;opacity:0;
    transition:transform calc(var(--l3-ms) * 1ms) cubic-bezier(.2,.7,.2,1),
               opacity calc(var(--l3-ms) * .91ms) ease-out;}
  .l3.style-grow.in{transform:scaleX(1);opacity:1;}
  .l3.style-grow.out{transition:transform calc(var(--l3-ms) * .36ms) cubic-bezier(.4,0,1,1),
                                opacity calc(var(--l3-ms) * .33ms) ease-in;
    transform:scaleX(.05);opacity:0;}
  .l3[data-side="right"].style-grow{transform-origin:right center;}

  /* style-slide-up: rises in from below instead of sliding from the side */
  .l3.style-slide-up{transform:translateY(220px);opacity:0;
    transition:transform calc(var(--l3-ms) * 1ms) cubic-bezier(.2,.7,.2,1),
               opacity calc(var(--l3-ms) * .91ms) ease-out;}
  .l3.style-slide-up.in{transform:translateY(0);opacity:1;}
  .l3.style-slide-up.out{transition:transform calc(var(--l3-ms) * .36ms) cubic-bezier(.4,0,1,1),
                                    opacity calc(var(--l3-ms) * .33ms) ease-in;
    transform:translateY(220px);opacity:0;}

  /* style-slide-down: drops in from above */
  .l3.style-slide-down{transform:translateY(-220px);opacity:0;
    transition:transform calc(var(--l3-ms) * 1ms) cubic-bezier(.2,.7,.2,1),
               opacity calc(var(--l3-ms) * .91ms) ease-out;}
  .l3.style-slide-down.in{transform:translateY(0);opacity:1;}
  .l3.style-slide-down.out{transition:transform calc(var(--l3-ms) * .36ms) cubic-bezier(.4,0,1,1),
                                      opacity calc(var(--l3-ms) * .33ms) ease-in;
    transform:translateY(-220px);opacity:0;}

  /* style-zoom: uniform scale from center, unlike style-grow's edge scaleX */
  .l3.style-zoom{transform:scale(.6);transform-origin:center center;opacity:0;
    transition:transform calc(var(--l3-ms) * 1ms) cubic-bezier(.2,.7,.2,1),
               opacity calc(var(--l3-ms) * .91ms) ease-out;}
  .l3.style-zoom.in{transform:scale(1);opacity:1;}
  .l3.style-zoom.out{transition:transform calc(var(--l3-ms) * .36ms) cubic-bezier(.4,0,1,1),
                                opacity calc(var(--l3-ms) * .33ms) ease-in;
    transform:scale(.6);opacity:0;}

  /* style-flip: 3D rotation in from the panel's own leading edge */
  .l3.style-flip{transform:rotateY(-85deg);transform-origin:left center;opacity:0;
    transition:transform calc(var(--l3-ms) * 1ms) cubic-bezier(.2,.7,.2,1),
               opacity calc(var(--l3-ms) * .91ms) ease-out;}
  .l3.style-flip.in{transform:rotateY(0deg);opacity:1;}
  .l3.style-flip.out{transition:transform calc(var(--l3-ms) * .36ms) cubic-bezier(.4,0,1,1),
                                opacity calc(var(--l3-ms) * .33ms) ease-in;
    transform:rotateY(-85deg);opacity:0;}
  .l3[data-side="right"].style-flip{transform-origin:right center;transform:rotateY(85deg);}
  .l3[data-side="right"].style-flip.out{transform:rotateY(85deg);}

  /* fade disabled: no transition at all, in/out flip instantly */
  .l3.no-fade{transition:none !important;}
  .l3 .logo{height:96px;max-width:220px;object-fit:contain;flex:none;margin:0 0 0 24px;}
  .l3[data-side="right"] .logo{margin:0 24px 0 0;}
  .l3 .accent{width:5px;height:104px;background:var(--accent);margin:0 16px 0 24px;flex:none;}
  .l3 .text{padding:16px 0;}
  .l3 .name{font-family:var(--font-sans);font-weight:600;font-size:52px;line-height:1;color:var(--name-color);}
  .l3 .title{font-size:32px;color:var(--title-color);margin-top:14px;line-height:1;}
  .l3 .subtitle{font-size:23px;font-weight:400;color:var(--title-color);opacity:.72;
    margin-top:10px;line-height:1;}
  .l3 .subtitle:empty{display:none;margin:0;}
  .l3 .logo[hidden]{display:none;}

  /* ── per-theme color tokens, transcribed verbatim from FaireL3s style*.json ── */
  /* (graphics/lower-third-live/_theme-colors.css.snippet) */
  body[data-theme-left="default"] .l3[data-side="left"],
  body[data-theme-right="default"] .l3[data-side="right"]{
    --panel-fill: rgba(251,248,246,0.92);
    --panel-border: rgb(223,224,225);
    --accent: rgb(181,169,152);
    --name-color: rgb(51,51,51);
    --title-color: rgb(117,117,117);
  }

  body[data-theme-left="dark"] .l3[data-side="left"],
  body[data-theme-right="dark"] .l3[data-side="right"]{
    --panel-fill: rgba(51,51,51,1.0);
    --panel-border: rgb(88,85,80);
    --accent: rgb(181,169,152);
    --name-color: rgb(255,255,255);
    --title-color: rgb(224,224,224);
  }

  body[data-theme-left="dark_alt"] .l3[data-side="left"],
  body[data-theme-right="dark_alt"] .l3[data-side="right"]{
    --panel-fill: rgba(0,0,0,1.0);
    --panel-border: rgb(51,51,51);
    --accent: rgb(181,169,152);
    --name-color: rgb(255,255,255);
    --title-color: rgb(200,200,200);
  }

  body[data-theme-left="bright"] .l3[data-side="left"],
  body[data-theme-right="bright"] .l3[data-side="right"]{
    --panel-fill: rgba(221,227,208,1.0);
    --panel-border: rgb(145,167,147);
    --accent: rgb(73,105,76);
    --name-color: rgb(62,64,35);
    --title-color: rgb(62,64,35);
  }

  body[data-theme-left="bright_info"] .l3[data-side="left"],
  body[data-theme-right="bright_info"] .l3[data-side="right"]{
    --panel-fill: rgba(226,231,240,1.0);
    --panel-border: rgb(122,120,133);
    --accent: rgb(27,40,52);
    --name-color: rgb(27,40,52);
    --title-color: rgb(122,120,133);
  }

  body[data-theme-left="bright_insider"] .l3[data-side="left"],
  body[data-theme-right="bright_insider"] .l3[data-side="right"]{
    --panel-fill: rgba(242,245,245,1.0);
    --panel-border: rgb(54,103,106);
    --accent: rgb(21,69,72);
    --name-color: rgb(21,69,72);
    --title-color: rgb(54,103,106);
  }

  body[data-theme-left="bright_warm"] .l3[data-side="left"],
  body[data-theme-right="bright_warm"] .l3[data-side="right"]{
    --panel-fill: rgba(246,239,219,1.0);
    --panel-border: rgb(209,185,133);
    --accent: rgb(144,124,58);
    --name-color: rgb(144,124,58);
    --title-color: rgb(144,124,58);
  }

  body[data-theme-left="palette_copper"] .l3[data-side="left"],
  body[data-theme-right="palette_copper"] .l3[data-side="right"]{
    --panel-fill: rgba(250,242,232,1.0);
    --panel-border: rgb(200,170,145);
    --accent: rgb(175,105,65);
    --name-color: rgb(75,50,38);
    --title-color: rgb(140,95,65);
  }

  body[data-theme-left="palette_olive"] .l3[data-side="left"],
  body[data-theme-right="palette_olive"] .l3[data-side="right"]{
    --panel-fill: rgba(235,225,195,1.0);
    --panel-border: rgb(160,155,125);
    --accent: rgb(118,115,70);
    --name-color: rgb(62,60,40);
    --title-color: rgb(118,115,70);
  }

  body[data-theme-left="palette_plum"] .l3[data-side="left"],
  body[data-theme-right="palette_plum"] .l3[data-side="right"]{
    --panel-fill: rgba(242,238,248,1.0);
    --panel-border: rgb(175,165,195);
    --accent: rgb(95,80,130);
    --name-color: rgb(55,48,72);
    --title-color: rgb(115,100,140);
  }

  body[data-theme-left="palette_sage"] .l3[data-side="left"],
  body[data-theme-right="palette_sage"] .l3[data-side="right"]{
    --panel-fill: rgba(232,238,232,1.0);
    --panel-border: rgb(140,165,150);
    --accent: rgb(75,100,88);
    --name-color: rgb(45,58,50);
    --title-color: rgb(85,110,95);
  }

  body[data-theme-left="palette_teal"] .l3[data-side="left"],
  body[data-theme-right="palette_teal"] .l3[data-side="right"]{
    --panel-fill: rgba(228,238,238,1.0);
    --panel-border: rgb(100,155,160);
    --accent: rgb(35,95,105);
    --name-color: rgb(25,70,75);
    --title-color: rgb(55,115,120);
  }

  body[data-theme-left="palette_terracotta"] .l3[data-side="left"],
  body[data-theme-right="palette_terracotta"] .l3[data-side="right"]{
    --panel-fill: rgba(248,238,232,1.0);
    --panel-border: rgb(195,165,155);
    --accent: rgb(165,95,85);
    --name-color: rgb(85,55,52);
    --title-color: rgb(130,85,80);
  }
</style>
</head>
<body id="stage-body" data-theme-left="default" data-theme-right="default">
<div id="stage">
  <div class="l3" data-side="left" id="l3-left">
    <img class="logo" id="logo-left" hidden alt="" />
    <div class="accent"></div>
    <div class="text">
      <div class="name" id="name-left"></div>
      <div class="title" id="title-left"></div>
      <div class="subtitle" id="subtitle-left" style="display:none"></div>
    </div>
  </div>
  <div class="l3" data-side="right" id="l3-right">
    <img class="logo" id="logo-right" hidden alt="" />
    <div class="accent"></div>
    <div class="text">
      <div class="name" id="name-right"></div>
      <div class="title" id="title-right"></div>
      <div class="subtitle" id="subtitle-right" style="display:none"></div>
    </div>
  </div>
</div>

<script>
  // ── WebSocket live state — driven by lower_third_apply/lower_third_hide ──
  // Structurally modeled on graphics/scoreboard-basketball/index.html's WS
  // handling (same reconnect-with-2s-backoff, same state/state_patch shapes),
  // but reads msg.payload.graphics.lowerThirds.left / .right instead of a
  // single .scoreboard. Left and right are independent cards, each driven by
  // its own makeCard() closure (pattern lifted from
  // bundled-packages/news/render-l3.html's per-side makeCard()).
  (function(){
    var wsUrl = 'ws://' + location.hostname + ':' + (location.port || '8080') + '/ws?graphics=1';

    var STYLE_CLASS_BY_ANIMATION = {
      wipe: 'style-wipe',
      grow: 'style-grow',
      'slide-up': 'style-slide-up',
      'slide-down': 'style-slide-down',
      zoom: 'style-zoom',
      flip: 'style-flip',
    };
    var STYLE_CLASSES = Object.keys(STYLE_CLASS_BY_ANIMATION).map(function (k) { return STYLE_CLASS_BY_ANIMATION[k]; });

    function makeCard(side) {
      var el = document.getElementById('l3-' + side);
      var nameEl = document.getElementById('name-' + side);
      var titleEl = document.getElementById('title-' + side);
      var subEl = document.getElementById('subtitle-' + side);
      var logoEl = document.getElementById('logo-' + side);
      var lastLt = null;

      function applyAnimationVars(lt) {
        el.classList.toggle('no-fade', lt.fadeEnabled === false);
        el.style.setProperty('--l3-ms', String(lt.fadeMs != null ? lt.fadeMs : 550));
        STYLE_CLASSES.forEach(function (c) { el.classList.remove(c); });
        var cls = STYLE_CLASS_BY_ANIMATION[lt.animationStyle];
        if (cls) el.classList.add(cls);
      }

      function triggerEnter(lt) {
        applyAnimationVars(lt);
        el.classList.remove('out');
        el.classList.remove('in');
        void el.offsetWidth; // reflow — forces the re-triggered transition
        el.classList.add('in');
      }

      function triggerExit(lt) {
        if (lt) applyAnimationVars(lt);
        el.classList.remove('in');
        void el.offsetWidth;
        el.classList.add('out');
      }

      return {
        apply: function (lt) {
          if (!lt || !lt.visible) {
            triggerExit(lt || lastLt);
            lastLt = lt || lastLt;
            return;
          }
          lastLt = lt;

          document.body.setAttribute('data-theme-' + side, lt.theme || 'default');
          nameEl.textContent = lt.name || '';
          titleEl.textContent = lt.title || '';
          subEl.textContent = lt.subtitle || '';
          subEl.style.display = lt.subtitle ? '' : 'none';

          if (lt.logoEnabled && lt.logoAssetId) {
            var src = '/api/l3/logos/' + encodeURIComponent(lt.logoAssetId) + '/file';
            if (logoEl.getAttribute('src') !== src) logoEl.setAttribute('src', src);
            logoEl.hidden = false;
          } else {
            logoEl.hidden = true;
          }

          triggerEnter(lt);
        },
      };
    }

    var left = makeCard('left');
    var right = makeCard('right');

    // Admin -> Background is the single authority for this page's backdrop.
    // 'transparent' keys straight through for an external switcher.
    function applyBackdrop(bg) {
      if (!bg) return;
      var fill = bg.type === 'transparent' ? 'transparent' : bg.value;
      document.documentElement.style.setProperty('--backdrop', fill);
    }

    function apply(lowerThirds) {
      var lts = lowerThirds || {};
      left.apply(lts.left);
      right.apply(lts.right);
    }

    function connect() {
      var ws = new WebSocket(wsUrl);
      ws.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data);
          if (msg.type === 'state' && msg.payload) {
            applyBackdrop(msg.payload.background);
            apply(msg.payload.graphics && msg.payload.graphics.lowerThirds);
          } else if (msg.type === 'state_patch' && msg.payload) {
            if (msg.payload.background) applyBackdrop(msg.payload.background);
            if (msg.payload.graphics) apply(msg.payload.graphics.lowerThirds);
          }
        } catch (err) {}
      };
      ws.onclose = function() { setTimeout(connect, 2000); };
      ws.onerror = function() { try { ws.close(); } catch (e) {} };
    }
    connect();
  })();
</script>
</body>
</html>
