name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download cloudflared binary
        env:
          # Unauthenticated api.github.com is rate limited per runner IP. When it
          # trips, `jq -r .tag_name` yields "null", the download 404s, and curl
          # writes "Not Found" to the file — which only surfaces as a confusing
          # "tar: Unrecognized archive format" several lines later.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
            | jq -r .tag_name)

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not resolve the latest cloudflared release tag"
            exit 1
          fi
          echo "cloudflared version: $version"

          mkdir -p cloudflared
          # -f so an HTTP error is a failure here rather than a corrupt file later.
          curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
            "https://github.com/cloudflare/cloudflared/releases/download/${version}/cloudflared-darwin-arm64.tgz" \
            -o /tmp/cloudflared.tgz

          tar -xzf /tmp/cloudflared.tgz -C cloudflared
          mv cloudflared/cloudflared cloudflared/cloudflared-darwin-arm64
          chmod +x cloudflared/cloudflared-darwin-arm64

          # Fail here, not three steps later inside electron-forge, if it is not usable.
          file cloudflared/cloudflared-darwin-arm64
          cloudflared/cloudflared-darwin-arm64 --version

      - name: Build DMG
        run: npx electron-forge make --platform darwin --arch arm64
        env:
          PCONAIR_BUILD_DATE: ${{ github.ref_name }}

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: false
          files: out/make/**/*.dmg
          body: |
            ## PConAir ${{ github.ref_name }}

            Unsigned build for internal testing.

            **macOS:** Open the DMG, drag PConAir to Applications.
            First launch: right-click → Open to bypass Gatekeeper.

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: macos-dmg
          path: out/make/**/*.dmg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download cloudflared binary
        shell: bash
        env:
          # Same rate-limit trap as the macOS job, but worse here: there is no
          # tar to choke on a bad file, so an unguarded 404 would be written
          # straight into the zip as a 9-byte "cloudflared.exe" and the build
          # would report success.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
            | jq -r .tag_name)

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not resolve the latest cloudflared release tag"
            exit 1
          fi
          echo "cloudflared version: $version"

          mkdir -p cloudflared
          curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
            "https://github.com/cloudflare/cloudflared/releases/download/${version}/cloudflared-windows-amd64.exe" \
            -o cloudflared/cloudflared-windows-amd64.exe

          # A real cloudflared.exe is tens of MB; anything tiny is an error page.
          size=$(wc -c < cloudflared/cloudflared-windows-amd64.exe)
          echo "cloudflared-windows-amd64.exe: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::cloudflared download looks wrong ($size bytes)"
            exit 1
          fi

      - name: Build Windows ZIP
        run: npx electron-forge make --platform win32 --arch x64
        env:
          PCONAIR_BUILD_DATE: ${{ github.ref_name }}

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: false
          files: out/make/**/*.zip
          body: |
            ## PConAir ${{ github.ref_name }}

            Unsigned build for internal testing.

            **Windows:** Extract the ZIP and run PConAir.exe.

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: windows-dist
          path: out/make/**/*.zip
